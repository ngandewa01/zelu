name: Device tests

# The tests in app/src/androidTest, on an Android emulator: database migrations, taking in older files, and screens.
# By hand from Actions only (an emulator run is about 9 minutes of the free Actions allowance); run it before a release.
on:
  workflow_dispatch:

# Reads the code only.
permissions:
  contents: read

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The emulator's data partition needs several GB; the runner's toolchains Zelu doesn't use take that room.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift && df -h /
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          # A small data partition: the tests write a few databases, not apps and media.
          disk-size: 2048M
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          retention-days: 14
          path: app/build/reports/androidTests/
