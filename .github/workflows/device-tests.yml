name: Device tests

# The tests in app/src/androidTest, on an Android emulator: database migrations, taking in older files, and screens.
# On pull requests to main, and by hand from Actions; ordinary pushes don't wait for an emulator.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          retention-days: 14
          path: app/build/reports/androidTests/
