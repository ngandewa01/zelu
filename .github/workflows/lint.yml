name: Lint

# Android lint over the release build: weekly, and by hand from Actions. Kept out of every build because it takes
# about five minutes; its findings are attached as a report.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Reads the code only.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lintRelease --no-daemon
      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          retention-days: 14
          path: app/build/reports/lint-results-release.*
