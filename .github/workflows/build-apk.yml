name: Build release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    permissions:
      # Needed to publish the GitHub Release.
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zelu-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Every main build becomes the latest release, so this link always serves the newest APK:
      # https://github.com/ngandewa01/zelu/releases/latest/download/zelu.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk zelu.apk
          gh release create "build-${{ github.run_number }}" zelu.apk \
            --target "${{ github.sha }}" \
            --title "Zelu build ${{ github.run_number }}" \
            --notes "$(git log -1 --format=%s)" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
