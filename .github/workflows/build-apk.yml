name: Build release APK

on:
  push:
  # Run by hand (Actions, "Build release APK", "Run workflow") to build main and, when ticked, upload it to Play.
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload this build to Google Play
        type: boolean
        default: false
      play_track:
        description: "Where: internal (only you, no review, any branch) or alpha (closed testing, main only)"
        type: choice
        options: [internal, alpha]
        default: internal

# A newer push to the same branch cancels the build still running for an older one,
# so the latest APK arrives sooner instead of waiting behind outdated builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      # Needed to publish the GitHub Release.
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Set once the Play upload is set up (see docs/play-upload.md); without it the upload step is skipped.
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle version comes from the wrapper in the repository (gradle/wrapper), the same one a local build uses;
      # this step also checks the wrapper jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The upload key lives only in the repository secrets. Without them the build stops: no APK or bundle
      # is ever signed with anything else.
      - name: Use signing key from secrets
        shell: bash
        env:
          KEY_B64: ${{ secrets.ZELU_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.ZELU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZELU_KEY_ALIAS }}
        run: |
          # Which secrets this build can see (set or missing, and length only; never the values).
          for n in KEY_B64 KEY_PASS KEY_ALIAS; do v="${!n}"; if [ -n "$v" ]; then echo "$n: set (${#v} chars)"; else echo "$n: missing"; fi; done
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/zelu-release.jks"
            echo "ZELU_KEYSTORE_PATH=$RUNNER_TEMP/zelu-release.jks" >> "$GITHUB_ENV"
            echo "ZELU_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            if [ -n "$KEY_ALIAS" ]; then echo "ZELU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"; fi
            echo "Signing with the key from repository secrets."
          else
            echo "::error::The signing secrets ZELU_KEYSTORE_B64 and ZELU_KEYSTORE_PASSWORD are missing (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log

      # When the build breaks, show the compiler errors as annotations (readable without downloading logs).
      - name: Show compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|Error:|Fatal:|What went wrong" -A2 build.log | head -60 | sed 's/^/::error::/' | tr -d '\r' || true
          # A lint error that stops the release build is named in the lint report.
          cat app/build/reports/lint-results-*.txt 2>/dev/null | grep -E "Error:|Fatal:" -B1 -A3 | head -30 | sed 's/^/::error::/' | tr -d '\r' || true
          # A parser test that fails names the message it read wrongly.
          grep -h -E "AssertionError|Should be" app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | head -10 | sed 's/^ *//; s/^/::error::/' | tr -d '\r' || true

      # Shows which key signed this build, to compare with the fingerprint of the key you made.
      - name: Show signing certificate
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256|DN"

      # Zelu promises it has no internet access. Fail the build if any library brings the permission back.
      - name: Check the app asks for no internet access
        shell: bash
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::The release APK asks for INTERNET; the privacy policy says it does not."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zelu-release-apk
          retention-days: 1
          path: app/build/outputs/apk/release/app-release.apk

      # The Play Store takes an app bundle (.aab), not an APK. The mapping file turns a shrunk library's
      # names in a crash back into readable ones (Play Console, App bundle explorer, Downloads).
      - name: Upload app bundle for the Play Store
        uses: actions/upload-artifact@v4
        with:
          name: zelu-release-aab
          retention-days: 7
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      # Every main build becomes the latest release, so this link always serves the newest APK:
      # https://github.com/ngandewa01/zelu/releases/latest/download/zelu.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk zelu.apk
          cp app/build/outputs/bundle/release/app-release.aab zelu.aab
          gh release create "build-${{ github.run_number }}" zelu.apk zelu.aab \
            --target "${{ github.sha }}" \
            --title "Zelu build ${{ github.run_number }}" \
            --notes "$(git log -1 --format=%s)" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

      # Only a hand-started build with "Upload this build to Google Play" ticked is uploaded; pushes never are.
      # internal: Internal testing (only you), from any branch, no review, on your phone within minutes.
      # alpha: Closed testing, from main only; Play sends it for review, and with managed publishing on an approved
      # release waits in Play Console, Publishing overview, until you press "Publish".
      # Release notes come from distribution/whatsnew/whatsnew-en-US.
      - name: Upload to Google Play
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.upload_to_play && env.PLAY_JSON != '' &&
          (inputs.play_track == 'internal' || github.ref == 'refs/heads/main')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.koolicream.zelu
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.play_track }}
          status: completed
          releaseName: ${{ github.run_number }} (0.3.${{ github.run_number }})
          whatsNewDirectory: distribution/whatsnew
