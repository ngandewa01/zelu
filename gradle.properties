# The build machine has 16 GB; the Compose screens are large, and 2 GB made the compiler spend time on memory.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
# Reuse task outputs (tests, lint, unchanged compiles) from earlier builds; CI keeps them in its Gradle cache.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true


