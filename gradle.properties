# The build machine has 16 GB; MainActivity.kt is large, and 2 GB made the compiler spend time on memory.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
# Reuse task outputs (tests, lint, unchanged compiles) from earlier builds; CI keeps them in its Gradle cache.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Public https address of the sponsor card file (see sponsor/README.md). Leave empty to switch sponsor cards off.
zelu.sponsorUrl=

# AdMob ids. These two are Google's TEST ids. Replace with your own from admob.google.com before the Play Store.
zelu.admobAppId=ca-app-pub-3940256099942544~3347511713
zelu.admobBannerUnit=ca-app-pub-3940256099942544/6300978111
